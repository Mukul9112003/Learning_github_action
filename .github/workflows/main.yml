name: Day11
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
jobs:
  job1:
    name: first job1
    runs-on: ubuntu_latest
    env: 
      API_KEY: ${{secrets.API_KEY}}
    steps:
      - name: Step 1
        uses: actions/checkout@v4
      - name: step2
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: install requirement
        run: python -m pip install -r requirement.txt
      - name: run test
        run: python -m pytest
      - name: check
        run: |
          if [ -z "$API_KEY" ]; then
            echo "NO secret found"
            exit 1
          else 
            echo "Present"
          fi
  job2:
    name: job2
    runs-on: ubuntu_latest
    needs: job1
    steps:
      - name: ste1
        run: echo "BROTHER=NITIN" >> $GITHUB_ENV
      - name: step2
        run: |
          echo $BROTHER
          echo $GITHUB_ACTOR
          echo $GITHUB_REF
          echo $GITHUB_REPOSITORY
          echo $GITHUB_RUN_ID
          echo $GITHUB_RUN_NUMBER
          echo $GITHUB_SHA
          echo $GITHUB_WORKFLOW
          echo $GITHUB_WORKSPACE
