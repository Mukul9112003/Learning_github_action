name: Day12
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
jobs:
  job1:
    name: job1
    runs-on: ubuntu-latest
    env: 
        USER: ${{secrets.API_KEY}}
    steps:
      - name: print variable
        run: |
          echo $GITHUB_ACTOR
          echo $GITHUB_REF
          echo $GITHUB_REPROSITORY
          echo $GITHUB_SHA
          echo $GITHUB_WORKSPACE
          echo $GITHUB_WORKFLOW
          echo $GITHUB_RUN_NUMBER
          echo $GITHUB_RUN_ID
          echo $RUNNER_OS
          echo "BROTHER=Nitin">>$GITHUB_ENV    
      - name: check
        run: |
          if [ -z "$USER" ]; then
            echo "Not present"
            exit 1
          else
            echo "present"
          fi
          echo $BROTHER
  job2:
    name: Job2
    needs: job1
    runs-on: ubuntu-latest
    steps: 
      - name: checkout
        uses: actions/checkout@v4
      - name: python
        uses: actions/setup-python@v5
        with:
            python-version: "3.11"
      - name: requirement
        run: python -m pip install -r requirements.txt
      - name: code syntax
        run: ruff check .
      - name: test
        run: pytest
      