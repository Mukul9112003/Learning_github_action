name: Day9
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 9 * * *"
env:
  NAME: "Mukul Mehta"
  ROLE: "Ai engineer"
  
jobs:
  job1:
    name: "Job_1"
    runs-on: ubuntu-latest
    env:
      TOKEN: ${{secrets.DEMO_TOKEN}}
      API_KEY: ${{secrets.API_KEY}}
    steps:
      - name: "step1"
        uses: actions/checkout@v4
      - name: "step2"
        run: git log --oneline
      - name: github_repro
        run: |
          echo $GITHUB_REPOSITORY
          echo $GITHUB_REF
          echo $GITHUB_SHA
          echo $RUNNER_OS
          echo $GITHUB_RUN_NUMBER
          echo $GITHUB_RUN_ID
          echo $GITHUB_WORKSPACE
          echo $GITHUB_WORKFLOW
          echo $GITHUB_ACTOR
          echo "BROTHER=NITIN" >> $GITHUB_ENV
      - name: "step3"
        run: | 
          echo $BROTHER
          if [ -z "$TOKEN"]; then 
            echo "Not PRESENT"
            exit 1
          else
            echo "present"
          fi