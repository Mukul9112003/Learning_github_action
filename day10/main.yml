name: Day10
on:
  push:
    branches:
      - main
jobs:
  job1:
    name: "first job"
    runs-on: ubuntu-latest
    env: 
      USER: ${{ secrets.APP_KEY }}
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install python
        uses: actions/setup-python@v5
        with: 
          python-version: "3.11"
      - name: requirement install
        run: python -m pip install -r requirements.txt
      - name: variable
        run: |
          echo "BROTHER=Nitin">>$GITHUB_ENV
          python --version
          pip --version
      - name: last step
        run: |
          echo $BROTHER
          if [ -z "$USER" ]; then
            echo "Not present"
            exit 1
          else
            echo "Present"
          fi
  job2:
    name: "first job"
    runs-on: ubuntu-latest
    needs: job1
    steps:
        - name: checkout
          uses: actions/checkout@v4
        - name: print predefine variable
          run: |
            echo $GITHUB_ACTOR
            echo $GITHUB_REF
            echo $GITHUB_RUN_ID
            echo $GITHUB_REPOSITORY
            echo $GITHUB_RUN_NUMBER
            echo $GITHUB_WORKFLOW
            echo $GITHUB_WORKSPACE
            echo $RUNNER_OS
            echo $GITHUB_SHA