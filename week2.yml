name: Week2
on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:
    schedule:
        - cron: "0 9 * * *"
env:
    APP_NAME: "CI_PRACTISE"
jobs:
    Validate:
        name: validate_report 
        runs-on: ubuntu-latest
        env:
            USER: ${{ secrets.API_KEY }}
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: git_version
              run: git --version
            - name: repository
              run: echo $GITHUB_REPOSITORY
            - name: os
              run: echo $RUNNER_OS
            - name: Envir
              run: |
               echo "BROTHER=Nitin" >> $GITHUB_ENV
            - name: revision
              run : |
               echo $GITHUB_REF
               echo $GITHUB_WORKFLOW
               echo $GITHUB_WORKSPACE
               echo $GITHUB_SHA
               echo $GITHUB_ACTOR
               echo $GITHUB_RUN_ID
               echo $GITHUB_RUN_NUMBER
               echo $APP_NAME
               echo $BROTHER
            - name: check
              run: |
                if [ -z "$USER"]; then
                    echo "not present"
                    exit 1
                else
                    echo "present"
                fi
    Test:
        name: test_report
        runs-on: ubuntu-latest
        needs: Validate
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: Print
              run: |
                echo Running tests...
                echo Tests successful
    Build:
        name: build_report
        runs-on: ubuntu-latest
        needs: Test
        steps:
            - name: checkout
              uses: actions/checkout@v4
            - name: create
              run: |
               echo "BUILD_VERSION=2.0.$GITHUB_RUN_NUMBER" >>$GITHUB_ENV
            - name: print
              run: |
                echo Building application version: $BUILD_VERSION
            - name: build
              run: |
                if [ -z "$BUILD_VERSION"]; then
                  echo Fail
                  exit 1
                else
                    echo "Build successful"
                fi